<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Application Parameters', ~{:: #content}, ~{:: #scripts})}">
<body>
<main id="content" th:fragment="content" class="content">
    <h1>Application Parameter Configuration</h1>
    <div class="form-container">
        <!-- LEFT SIDE: Data Inputs -->
        <div class="form-left">
            <form id="bondForm">
                <div>
                    <!-- ADMIN_V6 #1.a: options come from app_param_config.investment_type
                         (fetched from the cached config, rule #2) - not a static list -->
                    <label>Investment Type</label>
                    <select id="investmentTypeSelect" name="investmentType" required>
                        <option value="">-- Select Investment Type --</option>
                    </select>
                </div>
                <div>
                    <!-- ADMIN_V6 #1.b: options are the param_name values already used
                         for the selected investment type -->
                    <label>Parameter Name</label>
                    <select id="paramNameSelect" name="paramName" required>
                        <option value="">-- Select Investment Type first --</option>
                    </select>
                </div>
                <div><label>Parameter Value</label><input type="text" name="paramValue" required></div>
                <div>
                    <label>Note</label>
                    <textarea name="note" rows="4" cols="50"></textarea>
                </div>
                <button type="submit" class="primary">Save Param</button>
            </form>
        </div>
    </div>

    <div class="nav-buttons">
        <a class="btn" href="/index.html"><i data-lucide="house"></i>Home</a>
    </div>
</main>

<th:block id="scripts" th:fragment="scripts">
    <script th:src="@{/js/modules/param-config.js}"></script>
</th:block>
</body>
</html>
