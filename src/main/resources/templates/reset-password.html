<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-guest :: page('Set new password', ~{:: #content}, ~{:: #scripts})}">
<body>
<main id="content" th:fragment="content" class="guest-content">
    <div class="auth-card">
        <h2>Set a new password</h2>

        <div id="result" class="result" style="display:none;"></div>

        <form id="resetForm">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required minlength="8"
                   autocomplete="new-password">
            <div class="hint">At least 8 characters, with letters and digits.</div>

            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required
                   autocomplete="new-password">

            <button type="submit">Update password</button>
        </form>

        <div class="auth-links">
            <a href="/login.html">Back to sign in</a>
        </div>
    </div>
</main>

<th:block id="scripts" th:fragment="scripts">
    <script th:src="@{/js/modules/reset-password.js}"></script>
</th:block>
</body>
</html>
