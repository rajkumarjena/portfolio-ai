<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Fixed Deposit Records', ~{:: #content}, ~{:: #scripts})}">
<body>
<main id="content" th:fragment="content" class="content">
    <h1>Fixed Deposit Records</h1>

    <div class="nav-buttons">
        <a class="btn" href="/index.html"><i data-lucide="house"></i>Home</a>
        <a class="btn primary" href="/fds/fd-form.html"><i data-lucide="circle-plus"></i>Add Fixed Deposit</a>
    </div>

    <!-- Filter controls: one filter per field -->
    <div class="filter-section">
        <label>Bank</label>
        <select id="filterBank"><option value="">All</option></select>

        <label>Status</label>
        <select id="filterStatus">
            <option value="">All</option>
            <option value="ACTIVE">Active</option>
            <option value="CLOSED">Closed</option>
        </select>

        <p style="margin:10px 0 4px;">
            <label>Deposit From</label><input type="date" id="filterDepositFrom">
            <label>Deposit To</label><input type="date" id="filterDepositTo">
            <label>Maturity From</label><input type="date" id="filterMaturityFrom">
            <label>Maturity To</label><input type="date" id="filterMaturityTo">
        </p>
        <p style="margin:4px 0 10px;">
            <label>Amount Min</label><input type="number" id="filterAmountMin" min="0" step="0.01">
            <label>Amount Max</label><input type="number" id="filterAmountMax" min="0" step="0.01">
            <label>Interest % Min</label><input type="number" id="filterInterestMin" min="0" step="0.01">
            <label>Interest % Max</label><input type="number" id="filterInterestMax" min="0" step="0.01">
        </p>

        <button class="primary" onclick="applyFilter()"><i data-lucide="filter"></i>Apply Filter</button>
        <button class="secondary" onclick="resetFilter()">Reset</button>
    </div>

    <div class="summary-bar" id="summary"></div>

    <table class="data-table" id="fdTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Bank</th>
            <th>Deposit Amount</th>
            <th>Deposit Date</th>
            <th>Maturity Date</th>
            <th>Interest %</th>
            <th>Mature Amount</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
</main>

<th:block id="scripts" th:fragment="scripts">
    <script th:src="@{/js/modules/fd-view.js}"></script>
</th:block>
</body>
</html>
