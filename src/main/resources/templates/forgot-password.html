<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-guest :: page('Forgot password', ~{:: #content}, ~{:: #scripts})}">
<body>
<main id="content" th:fragment="content" class="guest-content">
    <div class="auth-card">
        <h2>Reset your password</h2>
        <p class="muted">
            Enter your PAN and the email registered with your account. We will send you a
            link that is valid for 30 minutes.
        </p>

        <div id="result" class="result" style="display:none;"></div>

        <form id="forgotForm">
            <label for="pan">PAN Number</label>
            <input type="text" id="pan" name="pan" maxlength="10" required
                   pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]"
                   title="PAN format: 5 letters, 4 digits, 1 letter" placeholder="ABCDE1234F">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Send reset link</button>
        </form>

        <div class="auth-links">
            <a href="/login.html">Back to sign in</a>
            <a href="/reset-password.html">Have a reset token?</a>
        </div>
    </div>
</main>

<th:block id="scripts" th:fragment="scripts">
    <script th:src="@{/js/modules/forgot-password.js}"></script>
</th:block>
</body>
</html>
