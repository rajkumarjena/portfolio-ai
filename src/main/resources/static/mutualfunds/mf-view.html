<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Mutual Fund SIPs</title>
    <link rel="stylesheet" href="mf-style.css">
</head>
<body>
<h2>Mutual Fund SIPs</h2>

<div class="nav-buttons" style="margin-top:0;">
    <button onclick="window.location.href='/index.html'">🏠 Home</button>
    <button onclick="window.location.href='/mutualfunds/mf-sip-form.html'">➕ Add SIP</button>
    <button onclick="window.location.href='/mutualfunds/mf-portfolio.html'">📊 MF Portfolio</button>
    <button onclick="window.location.href='/mutualfunds/mf-portfolio-transactions.html'">📋 All Transactions</button>
    <button onclick="runDueSips()" title="Execute every due instalment now (also runs daily at 03:00)">▶ Run Due Instalments</button>
</div>

<div class="cards" id="summaryCards"></div>

<div class="filter-section">
    <label>Status</label>
    <select id="statusFilter">
        <option value="">All</option>
        <option value="ACTIVE" selected>Active</option>
        <option value="PAUSED">Paused</option>
        <option value="CANCELLED">Cancelled</option>
        <option value="CLOSED">Closed</option>
        <option value="__ALL__">Show everything</option>
    </select>
    <label>Search</label>
    <input type="search" id="searchBox" placeholder="scheme / AMC / folio / notes">
</div>

<table class="mf-table" id="sipTable">
    <thead>
    <tr>
        <th>Scheme</th><th>AMC</th><th>Category</th><th>Folio</th>
        <th>SIP Amount</th><th>Type</th><th>Day</th><th>Start</th><th>End</th>
        <th>Bank</th><th>Units</th><th>Value (₹)</th><th>Status</th><th class="left">Actions</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<div id="emptyNote" class="muted" style="display:none; padding:12px;">
    No mutual fund SIPs yet - add one with "Add SIP".
</div>

<!-- Redeem dialog -->
<div class="modal-overlay" id="redeemModal">
    <div class="modal">
        <button class="close-x" onclick="closeRedeem()">×</button>
        <h3>Redeem Mutual Fund</h3>
        <div id="redeemInfo" class="muted"></div>
        <div class="field" style="margin-top:12px;">
            <label>Redeem by</label>
            <select id="redeemMode">
                <option value="UNITS">Number of units</option>
                <option value="AMOUNT">Amount to sell (₹)</option>
                <option value="FULL">Complete sell-off</option>
            </select>
        </div>
        <div class="field">
            <label>Value</label>
            <input type="number" id="redeemValue" min="0" step="0.0001">
        </div>
        <div class="muted">Units are sold from the oldest transaction to the newest
            (FIFO), as per standard procedure (MF.md 10).</div>
        <div style="margin-top:14px;">
            <button class="danger" onclick="confirmRedeem()">Confirm Redemption</button>
            <button onclick="closeRedeem()">Cancel</button>
        </div>
    </div>
</div>

<script src="/js/csrf.js"></script>
<script src="mf-view-script.js"></script>
</body>
</html>
