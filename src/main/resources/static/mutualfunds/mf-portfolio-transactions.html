<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mutual Fund Portfolio Transactions</title>
    <link rel="stylesheet" href="mf-style.css">
</head>
<body>
<h2>Mutual Fund Portfolio - All Transactions</h2>
<p class="muted">Review every investment - SIP instalments, purchases, redemptions and
    imported CAS entries (MF.md 8 / 19).</p>

<div class="nav-buttons" style="margin-top:0;">
    <button onclick="window.location.href='/index.html'">🏠 Home</button>
    <button onclick="window.location.href='/mutualfunds/mf-portfolio.html'">📊 Portfolio View</button>
    <button onclick="window.location.href='/mutualfunds/mf-view.html'">📊 SIP View</button>
    <button onclick="window.location.href='/mutualfunds/mf-import.html'">⬆ Import</button>
</div>

<div class="cards" id="summaryCards"></div>

<div class="filter-section">
    <label>From</label><input type="date" id="fromDate">
    <label>To</label><input type="date" id="toDate">
    <label>Fund house / AMC</label>
    <select id="amcFilter"><option value="">All</option></select>
    <label>Category</label>
    <select id="categoryFilter"><option value="">All</option></select>
    <label>Search</label>
    <input type="search" id="searchBox" placeholder="scheme / description">
    <button class="primary" onclick="load()">Apply</button>
    <button onclick="resetFilters()">Reset</button>
</div>

<div id="holdingNote" class="status-banner banner-PENDING" style="display:none;"></div>

<table class="mf-table" id="txnTable">
    <thead>
    <tr>
        <th>Date</th><th>Scheme</th><th>AMC</th><th>Category</th><th>Folio</th>
        <th>Type</th><th class="left">Description</th>
        <th>Units</th><th>NAV</th><th>Amount (₹)</th><th>Source</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<div id="emptyNote" class="muted" style="display:none; padding:12px;">
    No transactions match this search.
</div>

<script src="/js/csrf.js"></script>
<script src="mf-portfolio-transactions-script.js"></script>
</body>
</html>
