<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - User Roles</title>
    <link rel="stylesheet" href="bonds/bond-style.css">
    <style>
        body { background: #f4f7fb url('/assets/fd-background.svg') no-repeat center center fixed; background-size: cover; }
        .banner { background: #fff3cd; border-left: 5px solid #ffc107; padding: 10px 16px;
                  border-radius: 6px; margin-bottom: 14px; font-weight: 600; }
        .user-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px;
                      overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); font-size: 14px; }
        .user-table th { background-color: #0056b3; color: #fff; padding: 10px 8px; text-align: center;
                         border: 1px solid #004494; }
        .user-table td { padding: 9px 8px; border: 1px solid #cbd5e1; text-align: center; }
        .user-table tbody tr:nth-child(even) { background-color: #f8fafc; }
        .user-table select { padding: 5px; }
        .user-table button { padding: 6px 14px; background: #0056b3; color: #fff; border: none;
                             border-radius: 4px; cursor: pointer; }
        .user-table button:hover { background: #004494; }
        .user-table button:disabled { background: #9bb7d4; cursor: not-allowed; }
        .chip { display: inline-block; background: #eef2f7; border: 1px solid #cbd5e1; border-radius: 12px;
                padding: 2px 10px; margin: 0 4px 4px 0; font-size: 12px; }
        .role-chip { font-weight: 700; }
        .role-ADMIN { background: #ffe5d0; border-color: #ff9933; }
        .role-SUPERVISOR { background: #dbe9ff; border-color: #4c8be8; }
        .role-USER { background: #e2f4e5; border-color: #4caf50; }
        .locked-badge { color: #dc3545; font-weight: 700; }
        #feedback { font-weight: 600; margin: 10px 0; }
        #feedback.ok { color: #198754; }
        #feedback.fail { color: #dc3545; }
    </style>
</head>
<body>
<h2>User Role Management</h2>

<div class="banner">Admins can elevate any user to <strong>SUPERVISOR</strong> or <strong>ADMIN</strong>,
    or move them back to <strong>USER</strong>. You cannot change your own role here.</div>

<div class="nav-buttons">
    <button onclick="window.location.href='/index.html'">🏠 Home</button>
</div>

<div id="feedback"></div>

<table class="user-table" id="userTable">
    <thead>
    <tr>
        <th>Name</th><th>PAN</th><th>Emails</th><th>Current Role</th><th>Status</th>
        <th>Failed Logins</th><th>Elevate To</th><th>Action</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="/js/csrf.js"></script>
<script src="/admin-users-script.js"></script>
</body>
</html>
