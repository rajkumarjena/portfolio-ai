<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bond Returns Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .filter-section { margin-bottom: 20px; }
        .summary { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
<h2>Bond Returns Report</h2>

<!-- Filter Controls -->
<div class="filter-section">
    <label for="filterType">Filter By:</label>
    <select id="filterType">
        <option value="all">All</option>
        <option value="date">Specific Date</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
        <option value="range">Date Range</option>
    </select>

    <input type="date" id="filterDate" style="display:none;">
    <input type="month" id="filterMonth" style="display:none;">
    <input type="number" id="filterYear" placeholder="YYYY" style="display:none;">
    <input type="date" id="filterStart" style="display:none;">
    <input type="date" id="filterEnd" style="display:none;">

    <button onclick="applyFilter()">Apply Filter</button>
</div>

<!-- Report Table -->
<table id="reportTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Payment Date</th>
        <th>Interest Return</th>
        <th>Schedule</th>
        <th>Redemption</th>
        <th>Year</th>
        <th>Bond Ref</th>
    </tr>
    </thead>
    <tbody>
    <!-- Rows will be populated dynamically -->
    </tbody>
</table>

<!-- Summary -->
<div class="summary" id="summary"></div>
<div class="nav-buttons">
    <button onclick="window.location.href='/index.html'">🏠 Home</button>
</div>
<script src="/js/csrf.js"></script>
<script src="bond-return-report-script.js"></script>
</body>
</html>
