<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bond Entry Form</title>
	<link rel="stylesheet" href="bond-style.css">
</head>
<body>
<h2>Bond Details Entry</h2>
<div class="form-container">
    <!-- LEFT SIDE: Data Inputs -->
    <div class="form-left">
        <form id="bondForm">
            <div><label>Bond Name / ISIN</label><input type="text" name="bondName" required></div>
            <div>
                <label>Issuer</label>
                <select id="issuerSelect" name="issuer" required></select>
            </div>
            <div>
                <label>Credit Rating</label>
                <select id="creditRatingSelect" name="creditRating" required></select>
            </div>
            <!-- Added id="investmentDate" here for targeted setup -->
            <div><label>Investment Date</label><input type="date" id="investmentDate" name="investmentDate" required></div>
            <div><label>Investment Amount Per Unit</label><input type="number" id="investmentAmountPerUnit" name="investmentAmountPerUnit" required></div>
            <div><label>Face Value Per Unit</label><input type="number" id="faceValuePerUnit" name="faceValuePerUnit" required></div>
            <div><label>Units</label><input type="number" id="units" name="units" required></div>
            <div><label>Coupon Rate (%)</label><input type="number" step="0.01" name="couponRate" required></div>
            <div>
                <label>Coupon Type</label>
                <select name="couponType" required>
                    <option value="Fixed Interest">Fixed Interest</option>
                    <option value="Variable Interest">Variable Interest</option>
                </select>
            </div>

            <div>
                <label>Coupon Frequency</label>
                <select name="couponFrequency" required>
                    <option value="monthly">Monthly</option>
                    <option value="quarterly">Quarterly</option>
                    <option value="half-yearly">Half-Yearly</option>
                    <option value="annual">Annual</option>
                    <option value="at-maturity">At Maturity</option>
                </select>
            </div>			
			<div>
				<label>Interest Payment Start Date</label>
				<input type="date" id="interestPaymentStartDate" name="interestPaymentStartDate" required>
			</div>
			<div>
				<label>Maturity Date</label>
				<input type="date" id="maturityDate" name="maturityDate" required>
			</div>
            <div>
                <label>Type Of Security</label>
                <select name="typeOfSecurity" required>
                    <option value="Secured - Regular Bond/Debenture">Secured - Regular Bond/Debenture</option>
                </select>
            </div>

            <div>
                <label>Repayment Priority</label>
                <select name="repaymentPriority" required>
                    <option value="Senior">Senior</option>
                    <option value="Subordinate Tier 2-Lower">Subordinate Tier 2-Lower</option>
                </select>
            </div>

            <div>
                <label>Staggered Bond</label>
                <select name="staggeredBond" required>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div>
                <label>Listing</label>
                <select name="listing">
                    <option value="Listed">Listed</option>
                    <option value="Not Listed">Not Listed</option>
                </select>
            </div>

            <div><label>Notes</label><textarea name="notes"></textarea></div>
            <button type="submit">Save Bond</button>
        </form>
    </div>

    <!-- RIGHT SIDE: Real-time Calculation Panel -->
    <div class="form-right">
        <div class="calculation-card">
            <h3>Live Calculations</h3>
            <div class="total-display-group">
                <label for="investmentTotal">Investment Total</label>
                <input type="number" id="investmentTotal" readonly placeholder="0" style="width: 100%; font-size: 18px; font-weight: bold; color: #0056b3; background: #fff; padding: 8px;">
            </div>
        </div>
		
		<div class="table-container">
			<h2>Payment Schedule Management</h2>
            <!-- Add Record button container -->
            <div id="addRecordContainer"></div>
			<table>
				<thead>
					<tr>                    
						<th>Year</th>
						<th>Payment<br>Schedule</th>
						<th>Payment<br>Date</th>
						<th>Interest<br>Payout</th>
						<th>Redemption<br>Amount</th>
						<th>Redemption<br>Value %</th>
						<th>Action</th>
					</tr>
				</thead>
                <!-- The rows will be dynamically loaded here by JS -->
                <tbody id="paymentScheduleBody"></tbody>
			</table>
		</div>
    </div>
</div>

<div class="nav-buttons">
    <button type="button" onclick="navigateAway('/index.html')">🏠 Home</button>
    <button type="button" onclick="navigateAway('/bonds/bond-view.html')">📊 View Bonds</button>
</div>
<script src="/js/csrf.js"></script>
<script src="bond-form-script.js"></script>
</body>
</html>
