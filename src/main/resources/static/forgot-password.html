<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio - Forgot password</title>
    <link rel="stylesheet" href="bonds/bond-style.css">
    <style>
        body { background: #f4f7fb url('/assets/fd-background.svg') no-repeat center center fixed; background-size: cover; }
        .box-wrap { max-width: 440px; margin: 60px auto; }
        .box-card { background: #fff; padding: 28px 32px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
        .box-card h2 { margin-top: 0; color: #0056b3; }
        .box-card label { display: block; font-weight: 600; margin-top: 14px; }
        .box-card input { width: 100%; padding: 9px; margin-top: 5px; box-sizing: border-box;
                          border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        .box-card button { width: 100%; margin-top: 22px; padding: 11px; background: #0056b3;
                           color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
        .box-card button:hover { background: #004494; }
        .auth-links { margin-top: 18px; text-align: center; font-size: 14px; }
        .auth-links a { color: #0066cc; margin: 0 6px; }
        .result { margin-top: 16px; padding: 10px 14px; border-radius: 6px; font-weight: 600;
                  font-size: 14px; display: none; }
        .result.info  { background: #d1e7dd; border-left: 5px solid #198754; color: #0f5132; }
        .result.error { background: #f8d7da; border-left: 5px solid #dc3545; color: #842029; }
    </style>
</head>
<body>
<div class="box-wrap">
    <div class="box-card">
        <h2>Reset your password</h2>
        <p style="font-size:14px;color:#555;">
            Enter your PAN and the email registered with your account. We will send you a
            link that is valid for 30 minutes.
        </p>

        <div id="result" class="result"></div>

        <form id="forgotForm">
            <label for="pan">PAN Number</label>
            <input type="text" id="pan" name="pan" maxlength="10" required
                   pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]"
                   title="PAN format: 5 letters, 4 digits, 1 letter" placeholder="ABCDE1234F">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Send reset link</button>
        </form>

        <div class="auth-links">
            <a href="/login.html">Back to sign in</a>
            <a href="/reset-password.html">Have a reset token?</a>
        </div>
    </div>
</div>

<script src="/js/csrf.js"></script>
<script src="/forgot-password-script.js"></script>
</body>
</html>
