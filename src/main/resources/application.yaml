server:
  port: 8082
#  ssl:
#    key-store: "file:/home/ubuntu/keystore.p12"
#    key-store-type: "PKCS12"
#    key-store-password: "portfolio"
#    key-alias: "springboot"
spring:
  application:
    name: portfolio
  # CAS statements (xlsx/pdf) can be large - raise the default 1MB cap (MF.md 14)
  servlet:
    multipart:
      # raised for BACKUP.md 7: portfolio.db uploads replace the server file
      max-file-size: 200MB
      max-request-size: 210MB
  datasource:
    # ADMIN_V3 #2/#7: every database-specific setting lives in this one block,
    # so a future migration (PostgreSQL / SQL Server / Oracle) is a
    # PROPERTIES-ONLY change - swap url, driver-class-name,
    # spring.jpa.database-platform and the hikari block below. No Java code
    # holds any database knowledge.
    #
    # ADMIN_V3 #1/#5/#6/#8: SQLite pragmas that fix "[SQLITE_BUSY] The database
    # file is locked" when two processes (your app + the other instance) open
    # the same portfolio.db at the same time:
    #   - journal_mode=WAL  lets the single writer commit WHILE readers read,
    #                       here and in the other process (the old journal
    #                       mode blocked readers against writers across
    #                       processes - that was the reported failure). WAL is
    #                       stored persistently in the .db file, so both app
    #                       instances benefit; portfolio.db-wal / -shm
    #                       sidecars appear next to it and backup/refresh
    #                       already handles them.
    #   - busy_timeout=10000 SQLite WAITS up to 10s for a busy lock and
    #                       retries instead of failing the statement right
    #                       away (#5: "waiting time instead failing
    #                       immediately"). This wait is also the bound that
    #                       hands the lock to the next waiter - a writer
    #                       holding longer makes the next one fail with a
    #                       clear error instead of hanging forever (#4:
    #                       "maximum transaction execution time").
    #   - synchronous=NORMAL SQLite's recommended WAL companion: commits skip
    #                       the per-commit fsync (still crash-safe; only the
    #                       last commits on OS/power loss may be lost) so the
    #                       write lock is held for a shorter time too.
    url: "jdbc:sqlite:${user.home}/portfolio.db?busy_timeout=10000&journal_mode=WAL&synchronous=NORMAL"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # ADMIN_V3 #3/#4: the write-concurrency knob, managed from this file.
      # SQLite allows exactly ONE writer at a time, so the pool owns a single
      # connection: every transaction takes turns instead of racing itself for
      # the file lock, and threads queue instead of failing (#5). Transactions
      # are short service methods, so the queue drains immediately.
      # After migrating to PostgreSQL / SQL Server / Oracle, raise these to the
      # server's own capacity, e.g. maximum-pool-size: 10.
      maximum-pool-size: 1
      minimum-idle: 1
      # How long a thread waits for the (single) pooled connection before
      # giving up - keep it above the slowest request (the admin DB Query
      # screen may hold the connection up to app.admin.query.timeout-seconds).
      connection-timeout: 30000
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jpa:
    database-platform: com.artech.portfolio.common.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    # FIX: Add properties block to suppress explicit DDL constraint generation
    properties:
      hibernate:
        hbm2ddl:
          extra_physical_table_types: TABLE
    generate-ddl: true

# BACKUP.md 9/10: the one application log file, in user.home - the admin
# page downloads it and clears it back to zero bytes.
logging:
  file:
    name: ${user.home}/springboot.log

# Centralized date configuration
bond:
  dateFormat:
    monthlyInput: yyyy-MM
    dateInput: yyyy-MM-dd
pf:
  dateFormat:
    monthlyInput: yyyy-MM
    dateInput: yyyy-MM-dd
# MF.md 12e: how far the totals of a KFINTECH upload may drift from the
# statement's own summary before the reconciliation report stops being green.
# Percent values, one per measured total - units, cost value, market value.
mf:
  reconciliation:
    tolerance-units-percent: 0.5
    tolerance-cost-percent: 0.5
    tolerance-market-percent: 0.5
app:
  config:
    refreshRateDuration: PT15M
  # ADMIN_V1 Database Query: controls for direct database access (they do not
  # change the screen's behaviour - they only bound what a query can cost).
  admin:
    query:
      max-rows: 10000          # maximum DQL result rows returned to the screen
      timeout-seconds: 30      # statement execution timeout
      max-sql-length: 100000   # maximum size of one submitted query
  # BACKUP.md 3: pause before backup/refresh so in-flight requests can finish
  maintenance:
    drain-ms: 8000
  # Base URL used in password-reset emails (AUTH.md h)
  base-url: http://129.225.96.100:8081
  mail:
    from: kiit2005@gmail.com

